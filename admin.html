<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Jameel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{min-height:100vh;background:#0A2F2F;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:400px;background:#0F3A3A;border:1px solid rgba(255,255,255,.15);padding:24px;border-radius:12px}
h2{color:#fff;text-align:center} p{color:rgba(255,255,255,.5);text-align:center;font-size:12px;margin-top:6px}
input,textarea{width:100%;padding:11px;border:none;border-radius:6px;margin-top:12px;font-size:13px}
textarea{height:70px}
button{width:100%;background:#FF6B1A;color:#fff;border:none;padding:12px;border-radius:6px;margin-top:16px;font-weight:700;cursor:pointer}
.upload{border:1px dashed rgba(255,255,255,.3);padding:14px;text-align:center;border-radius:6px;margin-top:12px;color:rgba(255,255,255,.6);font-size:12px;cursor:pointer;background:rgba(255,255,255,.05)}
#preview{display:none;height:180px;background:#fff;border-radius:6px;margin-top:12px;padding:5px}
#preview img{width:100%;height:100%;object-fit:contain}
#out textarea{width:100%;height:140px;font-size:10px;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h2>Admin Panel ❤️</h2>
<p>Roz ki post yahan se dalo</p>
<input id="title" placeholder="Post Title - ex: Logo Design">
<input id="linkedin" placeholder="LinkedIn Post Link - https://">
<textarea id="desc" placeholder="Description likho"></textarea>
<label class="upload" for="file"><span id="fname">Choose File</span><input type="file" id="file" hidden accept="image/*" onchange="prev(this)"></label>
<div id="preview"><img id="img"></div>
<button onclick="publish()">Publish Karo</button>
<div id="out"></div>
</div>
<script>
function prev(i){if(i.files[0]){fname.innerText=i.files[0].name;let r=new FileReader();r.onload=e=>{img.src=e.target.result;preview.style.display='block';};r.readAsDataURL(i.files[0]);}}
function publish(){
let t=title.value, l=linkedin.value, d=desc.value, f=file.files[0];
if(!t||!f)return alert('Title aur Image zaroori hai');
let r=new FileReader();r.onload=e=>{
let post={title:t,linkedin:l,desc:d,image:e.target.result,date:new Date().toLocaleDateString()};
let old=JSON.parse(localStorage.getItem('posts')||'[]');old.unshift(post);localStorage.setItem('posts',JSON.stringify(old));
out.innerHTML=`<div style="margin-top:14px;color:#fff;font-size:12px;background:rgba(0,0,0,.3);padding:10px;border-radius:6px">✅ Ho gaya! Ab is code ko copy karke posts.json me paste karo:<textarea id="code">${JSON.stringify(old,null,2)}</textarea><button onclick="navigator.clipboard.writeText(document.getElementById('code').value);alert('Copy ho gaya')">Copy Code</button></div>`;
};r.readAsDataURL(f);
}
</script>
</body>
</html>
