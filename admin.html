<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{min-height:100vh;background:#0A2F2F;display:flex}
.left{width:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border-right:1px solid rgba(255,255,255,.08)}
.logo{font-size:28px;font-weight:800;color:#fff;display:flex;align-items:center;gap:12px}
.dot{width:38px;height:38px;background:linear-gradient(135deg,#FF8C1A,#00A99D);border-radius:8px 0 8px 0;transform:rotate(15deg)}
.right{width:50%;display:flex;align-items:center;justify-content:center;padding:40px}
.box{width:100%;max-width:360px}
.box h2{color:#fff;text-align:center;font-size:20px;font-weight:400}
.box.sub{color:rgba(255,255,255,.45);text-align:center;font-size:9px;letter-spacing:1.8px;margin-top:8px;text-transform:uppercase}
input,textarea{width:100%;padding:12px 14px;border:none;border-radius:4px;margin-top:14px;font-size:12px;outline:none;background:#fff;color:#111}
.box input:first-of-type{margin-top:30px}
.btn{width:100%;background:#FF6B1A;color:#fff;border:none;padding:12px;border-radius:4px;margin-top:24px;font-weight:700;cursor:pointer;font-size:12px;letter-spacing:1px}
.btn:hover{background:#e86015}
.forgot{text-align:center;margin-top:10px}
.forgot a{color:rgba(255,255,255,.4);font-size:9px;letter-spacing:1px;text-decoration:none}
.upload{border:1px dashed rgba(255,255,255,.25);padding:14px;text-align:center;border-radius:4px;margin-top:14px;cursor:pointer;background:rgba(255,255,255,.04)}
.upload span{color:rgba(255,255,255,.6);font-size:11px;letter-spacing:1px}
.preview{margin-top:12px;height:180px;background:#fff;border-radius:4px;padding:5px;display:none}
.preview img{width:100%;height:100%;object-fit:contain}
.success{margin-top:16px;background:#0F3A3A;border:1px solid rgba(255,255,255,.12);padding:12px;border-radius:4px;color:#fff;font-size:11px}
.success textarea{height:120px;font-family:monospace;font-size:10px;background:#0A2F2F;color:#fff;border:1px solid rgba(255,255,255,.12)}
@media(max-width:768px){body{flex-direction:column}.left,.right{width:100%;padding:50px 20px}.left{border-right:none;border-bottom:1px solid rgba(255,255,255,.08)}}
</style>
</head>
<body>
<div class="left">
<div class="logo"><div class="dot"></div> Bailey and Co.</div>
</div>
<div class="right">
<div class="box">
<h2>Welcome</h2>
<div class="sub">Please login to admin dashboard.</div>
<input id="title" placeholder="USERNAME / POST TITLE">
<textarea id="desc" placeholder="DESCRIPTION"></textarea>
<input id="linkedin" placeholder="LINKEDIN URL (OPTIONAL)">
<label class="upload" for="image"><span id="fname">UPLOAD IMAGE</span><input type="file" id="image" accept="image/*" hidden onchange="prev(this)"></label>
<div class="preview" id="b"><img id="img"></div>
<button class="btn" onclick="pub()">LOGIN</button>
<div class="forgot"><a href="#">FORGOTTEN YOUR PASSWORD?</a></div>
<div id="out"></div>
</div>
</div>
<script>
function prev(i){if(i.files[0]){document.getElementById('fname').innerText=i.files[0].name;let r=new FileReader();r.onload=e=>{document.getElementById('img').src=e.target.result;document.getElementById('b').style.display='block';};r.readAsDataURL(i.files[0]);}}
function pub(){
 let t=document.getElementById('title').value.trim(), l=document.getElementById('linkedin').value.trim(), d=document.getElementById('desc').value.trim(), f=document.getElementById('image').files[0];
 if(!t||!f)return alert('Title & Image required');
 let r=new FileReader();r.onload=e=>{
  let p={title:t,linkedin:l,desc:d,image:e.target.result,date:new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})};
  let o=JSON.parse(localStorage.getItem('jameel_posts')||'[]');o.unshift(p);localStorage.setItem('jameel_posts',JSON.stringify(o));
  document.getElementById('out').innerHTML=`<div class="success"><b style="color:#FF6B1A">PUBLISHED!</b> Copy this code to posts.json<textarea id="cb">${JSON.stringify(o,null,2)}</textarea><br><button onclick="navigator.clipboard.writeText(document.getElementById('cb').value);alert('Copied!')" style="margin-top:8px;background:#FF6B1A;color:#fff;border:none;padding:6px 12px;border-radius:4px;font-size:11px">Copy Code</button> <a href="index.html" style="background:#fff;color:#000;padding:6px 12px;border-radius:4px;text-decoration:none;font-size:11px;margin-left:6px">View Site</a></div>`;
 };r.readAsDataURL(f);
}
</script>
</body>
</html>
