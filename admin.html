<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Jameel</title>
<style>body{background:#061E1E;color:#fff;font-family:sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}.box{background:#102F2F;border:1px solid rgba(255,255,255,.1);padding:28px;border-radius:18px;width:100%;max-width:420px} input,textarea{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#0A2F2F;color:#fff} button{width:100%;padding:12px;margin-top:14px;background:#FF6B1A;color:#fff;border:0;border-radius:10px;font-weight:800;cursor:pointer} #main{display:none} #lock{text-align:center}</style>
</head><body>
<div class="box" id="lock">
<h2>🔒 Admin Login</h2>
<p style="opacity:.5;font-size:12px;margin-top:6px">Only Jameel</p>
<input type="password" id="pass" placeholder="Password">
<button onclick="check()">Unlock</button>
</div>
<div class="box" id="main">
<h2>Add Post</h2>
<input id="title" placeholder="Title">
<textarea id="desc" placeholder="Description"></textarea>
<input type="file" id="img" accept="image/*">
<input id="date" type="date">
<button onclick="generate()">Generate Code</button>
<textarea id="out" style="height:200px;display:none;margin-top:14px" readonly></textarea>
<p id="hint" style="font-size:11px;opacity:.5;margin-top:10px;display:none">Copy karke posts.json me paste karo</p>
</div>
<script>
function check(){
 if(pass.value==='jameel123'){
  lock.style.display='none'; main.style.display='block';
 }else{alert('Wrong Password!')}
}
function generate(){
 let t=title.value; let d=desc.value; let dt=date.value||new Date().toISOString().split('T')[0];
 let file=img.files[0]; if(!t||!file){alert('Missing');return}
 let r=new FileReader();
 r.onload=e=>{
  out.style.display='block'; hint.style.display='block';
  out.value=`{\n "title": "${t}",\n "desc": "${d}",\n "image": "${e.target.result}",\n "date": "${dt}"\n},`;
 };
 r.readAsDataURL(file);
}
</script>
</body></html>
