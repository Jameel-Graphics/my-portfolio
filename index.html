<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Pro - Jameel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:500px;background:#151515;border-radius:24px;padding:35px;border:1px solid #222}
h2{font-size:26px}
h2 span{color:#ff4d00}
p{color:#888;font-size:13px;margin:8px 0 20px}
label{font-size:12px;color:#aaa;margin-top:15px;display:block}
input,select,textarea{width:100%;padding:14px;margin-top:6px;background:#1f1f1f;border:1px solid #2a2a2a;border-radius:12px;color:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#ff4d00}
textarea{height:90px;resize:none}
.btn{width:100%;padding:15px;background:#ff4d00;border:none;border-radius:12px;color:#fff;font-weight:600;font-size:16px;margin-top:20px;cursor:pointer;transition:0.2s}
.btn:hover{background:#ff6a2a}
.preview{width:100%;height:200px;background:#1f1f1f;border-radius:12px;margin-top:15px;overflow:hidden;display:none}
.preview img{width:100%;height:100%;object-fit:cover}
.success{background:#00c85320;border:1px solid #00c853;color:#00e676;padding:15px;border-radius:12px;margin-top:20px;display:none;text-align:center}
.login-box{text-align:center}
.login-box input{margin-top:20px}
</style>
</head>
<body>

<div class="card" id="loginCard">
<div class="login-box">
<h2>Admin <span>Login</span> 🔒</h2>
<p>Sirf Jameel Hussain ke liye</p>
<input type="password" id="pass" placeholder="Password likho jani">
<button class="btn" onclick="login()">Login Karo</button>
<p id="loginError" style="color:#ff4444;display:none;margin-top:10px">Password galat hai jani!</p>
</div>
</div>

<div class="card" id="adminCard" style="display:none">
<h2>Add <span>Project</span> 🚀</h2>
<p>Naya design yahan se add karo - seedha website par ayega</p>

<label>Project Title *</label>
<input id="title" placeholder="Ex: Foodpanda Menu Design">

<label>Category</label>
<select id="category">
<option>Pizza Poster</option>
<option>Food Menu</option>
<option>Logo Design</option>
<option>Social Media Post</option>
<option>Restaurant Branding</option>
<option>Other</option>
</select>

<label>Image URL * (Ya design 1.png jaise naam)</label>
<input id="image_url" placeholder="design 1.png ya https://..." oninput="showPreview(this.value)">

<div class="preview" id="previewBox"><img id="previewImg"></div>

<label>Project Link (Optional)</label>
<input id="project_link" placeholder="https://behance.net/...">

<label>Description (Optional)</label>
<textarea id="desc" placeholder="Is design ke baare me kuch likho..."></textarea>

<button class="btn" id="publishBtn" onclick="publish()">🚀 Publish to Website</button>

<div class="success" id="successBox">
<b>✅ MashaAllah! Ho gaya!</b><br>
Project live ho gaya hai!<br><br>
<a href="index.html" target="_blank" style="color:#00e676;text-decoration:underline">Portfolio Dekho →</a>
</div>

</div>

<script>
const supabaseUrl = 'https://bfkpuxsppgdsvbuwknog.supabase.co'
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJma3B1eHNwcGdkc3ZidXdrbm9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ1NTk4NDEsImV4cCI6MjA3MDEzNTg0MX0.TI6RTlh56UHW-j5WGMuALvJe7P86SqW3VXMFkhBc4Uc'
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey)

function login(){
 let p = document.getElementById('pass').value
 if(p==='jameel123'){
   document.getElementById('loginCard').style.display='none'
   document.getElementById('adminCard').style.display='block'
 } else {
   document.getElementById('loginError').style.display='block'
 }
}

function showPreview(url){
 if(!url) return
 document.getElementById('previewBox').style.display='block'
 document.getElementById('previewImg').src=url
}

async function publish(){
 let btn = document.getElementById('publishBtn')
 let title=document.getElementById('title').value
 let category=document.getElementById('category').value
 let image_url=document.getElementById('image_url').value
 let project_link=document.getElementById('project_link').value

 if(!title||!image_url) return alert('Jani Title aur Image zaroori hai! ❤️')

 btn.innerText='Publishing... ⏳'
 btn.disabled=true

 let { error } = await supabaseClient.from('portfolio_projects').insert([{title, category, image_url, project_link}])
 
 if(error){
   alert('Error: '+error.message)
   btn.innerText='🚀 Publish to Website'
   btn.disabled=false
   return
 }

 document.getElementById('successBox').style.display='block'
 document.getElementById('title').value=''
 document.getElementById('image_url').value=''
 document.getElementById('project_link').value=''
 document.getElementById('desc').value=''
 document.getElementById('previewBox').style.display='none'
 btn.innerText='🚀 Publish to Website'
 btn.disabled=false

 setTimeout(()=>{ document.getElementById('successBox').style.display='none' }, 5000)
}
</script>
</body>
</html>
