<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:'Inter',sans-serif}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 5%;background:#0a0a0f;border-bottom:1px solid #1e1e26;position:sticky;top:0;z-index:100}
.logo-wrap{display:flex;align-items:center;gap:12px}
.logo-img{width:42px;height:42px;border-radius:10px;background:#ff4d00;object-fit:cover;border:1px solid #ff4d00}
.logo-text{font-size:12px;letter-spacing:3px;font-weight:700;color:#ff4d00;line-height:1}

.nav-links{display:flex;align-items:center;gap:32px}
.nav-links a{color:#777;text-decoration:none;font-size:12px;font-weight:500}

.btn-talk{background:#ff4d00;color:#000;padding:12px 26px;border-radius:100px;text-decoration:none;font-weight:800;font-size:12px}
.hero{display:grid;grid-template-columns:1.2fr 0.8fr;padding:80px 5% 60px;gap:40px;align-items:center}
.hero h1{font-size:72px;line-height:0.9;font-weight:900;letter-spacing:-2px;text-transform:uppercase;color:#f5f5f7}
.badge{background:#ff4d00;color:#000;padding:8px 16px;border-radius:100px;font-size:11px;font-weight:800;letter-spacing:1.5px;display:inline-block;margin:20px 0}
.hero p{color:#9a9aa3;max-width:440px;line-height:1.7;font-size:14px;margin-bottom:32px}
.btns{display:flex;gap:12px}
.btns a{padding:14px 28px;border-radius:100px;text-decoration:none;font-size:12px;font-weight:700}
.primary{background:#ff4d00;color:#000}.secondary{border:1px solid #2a2a32;color:#fff}
.stats{display:flex;gap:48px;margin-top:48px;border-top:1px solid #1e1e26;padding-top:24px}
.stats div b{font-size:24px;display:block;font-weight:900} .stats div span{font-size:10px;color:#666;letter-spacing:1px}
.hero-right{display:flex;justify-content:center;align-items:center;position:relative}
.hero-right::before{content:'';position:absolute;width:360px;height:360px;background:radial-gradient(circle,#ff4d0020,transparent 70%);border-radius:50%}
.circle{width:340px;height:340px;border-radius:50%;overflow:hidden;border:3px solid #ff4d00;box-shadow:0 0 0 12px rgba(255,77,0,0.08),0 0 80px rgba(255,77,0,0.25);position:relative;z-index:1;background:#15151c}
.circle img{width:100%;height:100%;object-fit:cover;object-position:top}
.works{padding:60px 5%;border-top:1px solid #1e1e26}
.works h2{font-size:18px;letter-spacing:3px;font-weight:800}
@media(max-width:900px){.hero{grid-template-columns:1fr}.hero h1{font-size:48px}.hero-right{order:-1}.circle{width:300px;height:300px}.nav-links{display:none}}
