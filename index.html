<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jameel Hussain | Designer</title>
<style>
*{margin:0; padding:0; box-sizing:border-box}
body{font-family:Arial; background:#f8f8f8}
header{background:#000; color:#fff; padding:40px 20px; text-align:center}
header h1{font-size:32px}
.container{max-width:900px; margin:auto; padding:20px}
.post{background:#fff; border-radius:15px; overflow:hidden; margin:25px 0; box-shadow:0 5px 15px rgba(0,0,0,.08)}
.post img{width:100%; display:block}
.post-body{padding:18px}
.post-body h3{margin:5px 0}
.post-body p{color:#555; margin:8px 0}
.meta{font-size:12px; color:#888}
.btn{display:inline-block; margin:5px 5px 0 0; padding:8px 14px; border-radius:20px; text-decoration:none; color:#fff; font-size:14px}
.btn-li{background:#0A66C2}
.btn-wa{background:#25D366}
</style>
</head>
<body>
<header>
<h1>Jameel Hussain</h1>
<p>Graphics Designer</p>
<a href="admin.html" style="color:#666; font-size:11px; text-decoration:none">Admin</a>
</header>

<div class="container">
<h2 style="margin-top:20px">My Work</h2>
<div id="list">Loading posts...</div>

<div style="margin-top:50px; background:#fff; padding:20px; border-radius:15px">
<h3>Comments 💬</h3>
<p style="font-size:13px; color:gray">Log yahan comment karenge to show hoga</p>
<div id="comments">
<script src="https://utteranc.es/client.js"
        repo="Jameel-Graphics/my-portfolio"
        issue-term="pathname"
        theme="github-light"
        crossorigin="anonymous"
        async>
</script>
</div>
</div>
</div>

<script>
async function load(){
 let localPosts = JSON.parse(localStorage.getItem('jameel_posts')||'[]');
 let serverPosts = [];
 try{
   let res = await fetch('posts.json?v='+Date.now());
   serverPosts = await res.json();
 }catch(e){}
 let all = serverPosts.length>0? serverPosts : localPosts;

 let html = '';
 if(all.length==0) html='<p style="margin:20px 0; color:gray">Abhi koi post nahi hai. Admin panel se pehli post dalo jani</p>';

 all.forEach(p=>{
   html+=`<div class="post">
     <img src="${p.image}">
     <div class="post-body">
       <div class="meta">${p.date||''}</div>
       <h3>${p.title}</h3>
       <p>${p.desc||''}</p>
       ${p.linkedin?`<a class="btn btn-li" href="${p.linkedin}" target="_blank">LinkedIn pe dekho</a>`:''}
       <a class="btn btn-wa" href="https://wa.me/?text=${encodeURIComponent(p.title+' - '+ (p.linkedin||''))}" target="_blank">Share</a>
     </div>
   </div>`;
 });
 document.getElementById('list').innerHTML=html;
}
load();
</script>
</body>
</html>
