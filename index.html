<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jameel Hussain | Visual Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f8f8fb;color:#111;line-height:1.6}
header{background:#000;color:#fff;padding:80px 20px 70px;text-align:center;position:relative}
header h1{font-size:42px;font-weight:800;letter-spacing:-1px}
header .tag{margin-top:8px;display:inline-block;background:#fff;color:#000;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600}
header .sub{opacity:.6;margin-top:14px;font-size:14px;max-width:500px;margin-left:auto;margin-right:auto}
.container{max-width:980px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;margin-top:30px}
.post{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.06);transition:.3s;border:1px solid #eee}
.post:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(0,0,0,.1)}
.img-wrap{width:100%;height:320px;background:#f1f1f1;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.img-wrap img{width:100%;height:100%;object-fit:contain;background:#fff; /* IMPORTANT: contain = no crop, no stretch */ }
.post-body{padding:18px 18px 20px}
.meta{font-size:11px;color:#999;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.post-body h3{font-size:17px;margin:6px 0 6px;font-weight:700;line-height:1.3}
.post-body p{font-size:13.5px;color:#555;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btns{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;text-decoration:none;color:#fff;display:inline-flex;align-items:center}
.btn-li{background:#0A66C2} .btn-share{background:#111}
.empty{text-align:center;background:#fff;padding:60px 20px;border-radius:20px;margin-top:30px;color:#888}
.admin-link{position:absolute;top:20px;right:20px;color:#666;text-decoration:none;font-size:11px;border:1px solid #333;padding:6px 12px;border-radius:20px}
@media(max-width:600px){header h1{font-size:32px}.img-wrap{height:280px}}
</style>
</head>
<body>
<header>
<a href="admin.html" class="admin-link">Admin</a>
<h1>Jameel Hussain</h1>
<div class="tag">Graphics Designer • Logo & Social Media Expert</div>
<p class="sub">Daily design work — crafted with passion. New designs published every day.</p>
</header>

<div class="container">
<h2 style="font-size:20px;font-weight:800;margin-top:10px">Latest Works ✨</h2>
<div id="posts" class="grid"><div class="empty">Loading designs...</div></div>

<div style="margin-top:50px;background:#fff;padding:24px;border-radius:18px;border:1px solid #eee">
<h3 style="font-size:16px;margin-bottom:12px">Comments 💬</h3>
<script src="https://utteranc.es/client.js" repo="Jameel-Graphics/my-portfolio" issue-term="pathname" theme="github-light" crossorigin="anonymous" async></script>
</div>
</div>

<script>
async function loadPosts(){
 try{
  let res = await fetch('posts.json?v='+Date.now());
  let posts = await res.json();
  let box = document.getElementById('posts');
  if(!posts || posts.length==0){
   box.innerHTML = `<div class="empty" style="grid-column:1/-1">No designs yet.<br><br><a href="admin.html" style="background:#000;color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none">Publish First Design</a></div>`;
   return;
  }
  box.innerHTML = posts.map(p=>`
   <div class="post">
    <div class="img-wrap">
     <img src="${p.image}" loading="lazy" alt="${p.title}">
    </div>
    <div class="post-body">
     <div class="meta">${p.date||''}</div>
     <h3>${p.title}</h3>
     <p>${p.desc||''}</p>
     <div class="btns">
      ${p.linkedin?`<a class="btn btn-li" href="${p.linkedin}" target="_blank">LinkedIn</a>`:''}
      <a class="btn btn-share" href="https://wa.me/?text=${encodeURIComponent(p.title+' - '+window.location.href)}" target="_blank">Share</a>
     </div>
    </div>
   </div>`).join('');
 }catch(e){
  document.getElementById('posts').innerHTML='<div class="empty">Error loading. Check posts.json</div>';
 }
}
loadPosts();
</script>
</body>
</html>
