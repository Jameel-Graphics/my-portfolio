<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#050505;color:#fff;font-family:'Inter',sans-serif}

nav{display:flex;justify-content:space-between;padding:22px 5%;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:#050505;z-index:99}
.logo{color:#ff4d00;letter-spacing:5px;font-size:11px;font-weight:700}

.btn{background:#ff4d00;color:#000;padding:11px 24px;border-radius:100px;text-decoration:none;font-weight:700;font-size:12px}
.hero{display:grid;grid-template-columns:1.2fr 0.8fr;padding:60px 5%;gap:30px;align-items:center}
.hero h1{font-size:80px;line-height:0.9;letter-spacing:-2px}
.badge{background:#ff4d00;color:#000;padding:5px 14px;border-radius:100px;font-size:11px;font-weight:700;display:inline-block;margin:14px 0}

.o{background:#ff4d00;color:#000}.b{border:1px solid #333;color:#fff}
.stats{display:flex;gap:36px;margin-top:36px;border-top:1px solid #1a1a1a;padding-top:20px}
.stats b{font-size:24px;display:block;font-family:'Syne'} .stats span{font-size:10px;color:#555}
.hero-img{display:flex;align-items:center;justify-content:center;position:relative}
.hero-img::before{content:'';position:absolute;width:360px;height:360px;background:radial-gradient(circle,#ff4d0025,transparent 70%);border-radius:50%}
.circle{width:340px;height:340px;border-radius:50%;overflow:hidden;border:3px solid #ff4d00;box-shadow:0 0 0 10px #ff4d0012,0 0 60px #ff4d0030;position:relative;z-index:1}
.circle img{width:100%;height:100%;object-fit:cover;object-position:top}
@media(max-width:900px){.hero{grid-template-columns:1fr}.hero-img{order:-1}.circle{width:300px;height:300px}}
.works{padding:40px 5%;border-top:1px solid #111}

</head>
