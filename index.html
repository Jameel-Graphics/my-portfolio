<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jameel Graphics | Visual Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0A2F2F;color:#fff;min-height:100vh}
header{padding:80px 20px 60px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);position:relative;background:radial-gradient(circle at top right,rgba(255,107,26,.15),transparent 50%)}
h1{font-size:48px;font-weight:800;letter-spacing:-1px} h1 span{color:#FF6B1A}
.tag{margin-top:12px;display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:7px 16px;border-radius:30px;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.7);text-transform:uppercase}
.container{max-width:1100px;margin:auto;padding:30px 20px}
.heading{font-size:11px;letter-spacing:2px;opacity:.5;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;margin-top:24px}
.post{background:#0F3A3A;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;transition:.4s}
.post:hover{transform:translateY(-6px);border-color:rgba(255,107,26,.35)}
.img-wrap{width:100%;height:340px;background:#0C3535;display:flex;align-items:center;justify-content:center;padding:10px}
.img-wrap img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:10px}
.post-body{padding:18px}
.meta{font-size:10px;color:#FF6B1A;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.post-body h3{font-size:16px;margin:6px 0;color:#fff;line-height:1.3}
.post-body p{font-size:13px;color:rgba(255,255,255,.55);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btns{margin-top:14px;display:flex;gap:8px}
.btn{padding:8px 14px;border-radius:6px;font-size:11px;font-weight:700;text-decoration:none;letter-spacing:.5px}
.btn-li{background:#FF6B1A;color:#fff}
.btn-share{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;background:#0F3A3A;border:1px dashed rgba(255,255,255,.15);border-radius:16px;color:rgba(255,255,255,.5)}
.admin{position:absolute;top:20px;right:20px;background:#FF6B1A;color:#fff;padding:8px 14px;border-radius:6px;font-size:11px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<header>
<a href="admin.html" class="admin">ADMIN LOGIN</a>
<h1>Jameel <span>Graphics</span></h1>
<div class="tag">Graphics Designer • Logo & Social Media Expert</div>
</header>
<div class="container">
<div class="heading">Latest Works ✨</div>
<div id="posts" class="grid"><div class="empty">Loading...</div></div>
</div>
<script>
async function load(){
 try{
  let r=await fetch('posts.json?v='+Date.now());
  let posts=await r.json();
  let box=document.getElementById('posts');
  if(!posts.length){box.innerHTML=`<div class="empty">No designs yet<br><br><a href="admin.html" style="background:#FF6B1A;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:700">Publish First Design</a></div>`;return;}
  box.innerHTML=posts.map(p=>`<div class="post"><div class="img-wrap"><img src="${p.image}" loading="lazy"></div><div class="post-body"><div class="meta">${p.date||''}</div><h3>${p.title}</h3><p>${p.desc||''}</p><div class="btns">${p.linkedin?`<a class="btn btn-li" href="${p.linkedin}" target="_blank">LinkedIn</a>`:''}<a class="btn btn-share" href="#">Share</a></div></div></div>`).join('');
 }catch(e){document.getElementById('posts').innerHTML='<div class="empty">Error loading posts.json</div>'}
}
load();
</script>
</body>
</html>
