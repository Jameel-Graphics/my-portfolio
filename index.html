<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jameel Hussain | Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0A2F2F;color:#fff}
header{text-align:center;padding:80px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
h1{font-size:46px;font-weight:800} h1 span{color:#FF6B1A}
.tag{margin-top:12px;display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:8px 18px;border-radius:30px;font-size:12px;color:#fff}
.grid{max-width:1100px;margin:30px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:0 20px}
.card{background:#0F3A3A;border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden}
.card.img{height:320px;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px}
.card.img img{width:100%;height:100%;object-fit:contain}
.card.info{padding:16px}
.card.info h3{font-size:15px}
.card.info p{font-size:12px;opacity:.6;margin-top:4px}
.btns{margin-top:12px;display:flex;gap:8px}
.btns a{padding:7px 12px;border-radius:6px;font-size:11px;font-weight:700;text-decoration:none}
.li{background:#FF6B1A;color:#fff}.sh{background:rgba(255,255,255,.1);color:#fff}
.admin-link{position:absolute;top:15px;right:15px;background:#FF6B1A;color:#fff;padding:6px 12px;border-radius:6px;font-size:11px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<header style="position:relative">
<a href="admin.html" class="admin-link">ADMIN</a>
<h1>Jameel <span>Hussain</span></h1>
<div class="tag">Graphics Designer • Logo & Social Media Expert</div>
</header>
<div id="posts" class="grid"></div>
<script>
fetch('posts.json?v='+Date.now()).then(r=>r.json()).then(posts=>{
let box=document.getElementById('posts');
if(!posts.length){box.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;opacity:.6">No posts yet. Go to Admin to publish.</div>';return;}
box.innerHTML=posts.map(p=>`<div class="card"><div class="img"><img src="${p.image}"></div><div class="info"><h3>${p.title}</h3><p>${p.desc||''} - ${p.date||''}</p><div class="btns">${p.linkedin?`<a class="li" href="${p.linkedin}" target="_blank">LinkedIn</a>`:''}<a class="sh" href="#">Share</a></div></div></div>`).join('');
});
</script>
</body>
</html>
