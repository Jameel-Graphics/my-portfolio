<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{min-height:100vh;background:#0A2F2F;display:flex}
.left{width:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border-right:1px solid rgba(255,255,255,.08);background:radial-gradient(circle at center,rgba(255,107,26,.15),transparent 60%)}
.logo-wrap{display:flex;align-items:center;gap:14px}
.icon{width:46px;height:46px;background:linear-gradient(135deg,#FF6B1A 0%,#FFB627 50%,#00D1A0 100%);border-radius:12px 0 12px 0;transform:rotate(8deg);box-shadow:0 10px 30px rgba(255,107,26,.4);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:22px;transform:rotate(-8deg)}
.brand h1{color:#fff;font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1}
.brand h1 span{color:#FF6B1A}
.brand p{color:rgba(255,255,255,.45);font-size:10px;letter-spacing:2.5px;margin-top:5px;text-transform:uppercase;font-weight:600}
.right{width:50%;display:flex;align-items:center;justify-content:center;padding:40px}
.box{width:100%;max-width:360px}
.box h2{color:#fff;text-align:center;font-size:22px;font-weight:500}
.box.sub{color:rgba(255,255,255,.45);text-align:center;font-size:9px;letter-spacing:1.8px;margin-top:8px;text-transform:uppercase}
input,textarea{width:100%;padding:12px 14px;border:none;border-radius:4px;margin-top:14px;font-size:12px;outline:none;background:#fff;color:#111}
.box input:first-of-type{margin-top:32px}
.btn{width:100%;background:#FF6B1A;color:#fff;border:none;padding:12px;border-radius:4px;margin-top:24px;font-weight:700;cursor:pointer;font-size:12px;letter-spacing:1px;transition:.2s}
.btn:hover{background:#e85f15;transform:translateY(-1px)}
.forgot{text-align:center;margin-top:12px}
.forgot a{color:rgba(255,255,255,.35);font-size:9px;letter-spacing:1px;text-decoration:none}
.upload{border:1px dashed rgba(255,255,255,.25);padding:13px;text-align:center;border-radius:4px;margin-top:14px;cursor:pointer;background:rgba(255,255,255,.04);transition:.2s}
.upload:hover{background:rgba(255,255,255,.07);border-color:#FF6B1A}
.upload span{color:rgba(255,255,255,.6);font-size:11px;letter-spacing:1px}
.preview{margin-top:12px;height:180px;background:#fff;border-radius:4px;padding:5px;display:none}
.preview img{width:100%;height:100%;object-fit:contain}
.success{margin-top:16px;background:#0F3A3A;border:1px solid rgba(255,107,26,.3);padding:12px;border-radius:6px;color:#fff;font-size:11px}
.success textarea{height:120px;font-family:monospace;font-size:10px;background:#0A2F2F;color:#fff;border:1px solid rgba(255,255,255,.12);margin-top:8px}
@media(max-width:768px){body{flex-direction:column}.left,.right{width:100%;padding:50px 20px}.left{border-right:none;border-bottom:1px solid rgba(255,255,255,.08)}}
</style>
</head>
<body>
<div class="left">
  <div class="logo-wrap">
    <div class="icon">J</div>
    <div class="brand">
      <h1>Jameel <span>Graphics</span></h1>
      <p>Logo • Branding • Social</p>
    </div>
  </div>
</div>

<div class="right">
<div class="box">
<h2>Welcome</h2>
<div class="sub">Please login to admin dashboard.</div>
<input id="title" placeholder="USERNAME / POST TITLE">
<textarea id="desc" placeholder="DESCRIPTION"></textarea>
<input id="linkedin" placeholder="LINKEDIN URL (OPTIONAL)">
<label class="upload" for="image"><span id="fname">UPLOAD IMAGE</span><input type="file" id="image" accept="image/*" hidden onchange="prev(this)"></label>
<div class="preview" id="b"><img id="img"></div>
<button class="btn" onclick="pub()">LOGIN</button>
<div class="forgot"><a href="index.html">← BACK TO PORTFOLIO</a></div>
<div id="out"></div>
</div>
</div>

<script>
function prev(i){if(i.files[0]){document.getElementById('fname').innerText=i.files[0].name;let r=new FileReader();r.onload=e=>{document.getElementById('img').src=e.target.result;document.getElementById('b').style.display='block';};r.readAsDataURL(i.files[0]);}}
function pub(){
 let t=document.getElementById('title').value.trim(), l=document.getElementById('linkedin').value.trim(), d=document.getElementById('desc').value.trim(), f=document.getElementById('image').files[0];
 if(!t||!f)return alert('Title & Image required');
 let r=new FileReader();r.onload=e=>{
  let p={title:t,linkedin:l,desc:d,image:e.target.result,date:new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})};
  let o=JSON.parse(localStorage.getItem('jameel_posts')||'[]');o.unshift(p);localStorage.setItem('jameel_posts',JSON.stringify(o));
  document.getElementById('out').innerHTML=`<div class="success"><b style="color:#FF6B1A">PUBLISHED!</b> Copy to posts.json<textarea id="cb">${JSON.stringify(o,null,2)}</textarea><br><button onclick="navigator.clipboard.writeText(document.getElementById('cb').value);alert('Copied!')" style="margin-top:8px;background:#FF6B1A;color:#fff;border:none;padding:7px 14px;border-radius:4px;font-size:11px;font-weight:700">Copy Code</button></div>`;
 };r.readAsDataURL(f);
}
</script>
</body>
</html>
