<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Jameel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f6f7fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:520px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.08);overflow:hidden}
.header{background:#000;color:#fff;padding:28px 30px}
.header h1{font-size:22px;display:flex;align-items:center;gap:10px}
.header p{font-size:13px;opacity:.7;margin-top:6px}
.body{padding:26px 28px}
label{font-size:13px;font-weight:600;margin:14px 0 6px;display:block;color:#111}
input,textarea{width:100%;padding:14px 15px;border:1.5px solid #e6e8ef;border-radius:12px;font-size:14px;outline:none;transition:.2s;background:#fafafb}
input:focus,textarea:focus{border-color:#000;background:#fff}
textarea{height:100px;resize:none}
.upload-box{border:2px dashed #d9dce8;border-radius:12px;padding:18px;text-align:center;background:#fafafb;margin-top:6px;cursor:pointer}
.upload-box input{display:none}
.upload-box span{font-size:13px;color:#666}
.btn{width:100%;background:#000;color:#fff;border:none;padding:15px;border-radius:12px;font-size:15px;font-weight:600;margin-top:20px;cursor:pointer;transition:.2s}
.btn:hover{background:#222;transform:translateY(-1px)}
.success{background:#eef6ff;border:1px solid #c7ddff;padding:16px;border-radius:12px;margin-top:20px;font-size:13px}
.success textarea{height:220px;margin-top:12px;background:#fff;font-family:monospace;font-size:11px}
.link{margin-top:12px;display:inline-block;background:#111;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font-size:12px}
.preview{margin-top:15px;border-radius:12px;overflow:hidden;display:none}
.preview img{width:100%;display:block}
</style>
</head>
<body>
<div class="card">
<div class="header">
<h1>Admin Panel ✨</h1>
<p>Publish your daily design work</p>
</div>
<div class="body">
<label>Post Title</label>
<input id="title" placeholder="e.g. Minimal Logo Design for Client">

<label>LinkedIn Post URL (Optional)</label>
<input id="linkedin" placeholder="https://www.linkedin.com/posts/...">

<label>Description</label>
<textarea id="desc" placeholder="Write about your design process..."></textarea>

<label>Upload Design Image</label>
<label class="upload-box" for="image">
<span id="fileName">Click to choose image (JPG, PNG)</span>
<input type="file" id="image" accept="image/*" onchange="showPreview(this)">
</label>

<div class="preview" id="previewBox"><img id="previewImg"></div>

<button class="btn" onclick="publish()">Publish Post 🚀</button>

<div id="out"></div>
</div>
</div>

<script>
function showPreview(input){
 if(input.files && input.files[0]){
  document.getElementById('fileName').innerText = input.files[0].name;
  let reader = new FileReader();
  reader.onload = e => {
   document.getElementById('previewImg').src = e.target.result;
   document.getElementById('previewBox').style.display='block';
  }
  reader.readAsDataURL(input.files[0]);
 }
}

function publish(){
 let t=document.getElementById('title').value.trim();
 let l=document.getElementById('linkedin').value.trim();
 let d=document.getElementById('desc').value.trim();
 let f=document.getElementById('image').files[0];
 if(!t) return alert('Please enter post title');
 if(!f) return alert('Please select an image');

 let r=new FileReader();
 r.onload=function(e){
   let post={title:t, linkedin:l, desc:d, image:e.target.result, date:new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})};
   let old=JSON.parse(localStorage.getItem('jameel_posts')||'[]');
   old.unshift(post);
   localStorage.setItem('jameel_posts', JSON.stringify(old));
   document.getElementById('out').innerHTML=`<div class="success">
   <b>✅ Published Successfully!</b><br>
   Now copy the code below and paste it into your <b>posts.json</b> file on GitHub, then commit.
   <textarea id="copyBox">${JSON.stringify(old,null,2)}</textarea>
   <div style="margin-top:10px">
   <a class="link" href="#" onclick="copyCode()">Copy Code</a>
   <a class="link" href="index.html" target="_blank" style="background:#0A66C2">View Portfolio</a>
   </div>
   </div>`;
   window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
 }
 r.readAsDataURL(f);
}
function copyCode(){
 let b=document.getElementById('copyBox');
 b.select();
 document.execCommand('copy');
 alert('Copied! Now paste in posts.json');
}
</script>
</body>
</html>
