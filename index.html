<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - 3D Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 20%,#7c3aed40,transparent 40%),radial-gradient(circle at 80% 80%,#22d3ee40,transparent 40%),#08080f}
.card{width:100%;max-width:520px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(24px);border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.header{padding:30px;border-bottom:1px solid rgba(255,255,255,.12)}
.header h1{color:#fff;font-size:22px} .header p{color:rgba(255,255,255,.6);font-size:13px;margin-top:6px}
.body{padding:26px}
label{color:#fff;font-size:12px;font-weight:700;opacity:.8;margin:16px 0 7px;display:block;letter-spacing:.5px}
input,textarea{width:100%;padding:14px 15px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;outline:none;font-size:14px}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.4)}
textarea{height:90px;resize:none}
.upload{border:1.5px dashed rgba(255,255,255,.2);border-radius:14px;padding:20px;text-align:center;background:rgba(255,255,255,.04);cursor:pointer;margin-top:6px}
.upload span{color:rgba(255,255,255,.6);font-size:13px}
.btn{width:100%;padding:15px;border-radius:14px;border:none;background:#fff;color:#000;font-weight:800;font-size:15px;margin-top:22px;cursor:pointer}
.preview{margin-top:16px;border-radius:14px;overflow:hidden;display:none;height:260px;background:rgba(255,255,255,.05);padding:8px}
.preview img{width:100%;height:100%;object-fit:contain;border-radius:10px;background:#fff}
.success{margin-top:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:16px;border-radius:14px;color:#fff;font-size:12px}
.success textarea{height:180px;font-family:monospace;font-size:11px;margin-top:10px;background:rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="card">
<div class="header"><h1>Admin Panel ✨</h1><p>Publish daily work - 3D Glass Mode</p></div>
<div class="body">
<label>Title</label><input id="title" placeholder="e.g. Luxury Logo Design">
<label>LinkedIn URL</label><input id="linkedin" placeholder="https://linkedin.com/posts/...">
<label>Description</label><textarea id="desc" placeholder="About this design..."></textarea>
<label>Image - Will NOT stretch or crop</label>
<label class="upload" for="image"><span id="fname">Click to choose image</span><input type="file" id="image" accept="image/*" hidden onchange="prev(this)"></label>
<div class="preview" id="box"><img id="img"></div>
<button class="btn" onclick="pub()">Publish Design 🚀</button>
<div id="out"></div>
</div>
</div>
<script>
function prev(i){if(i.files[0]){document.getElementById('fname').innerText=i.files[0].name;let r=new FileReader();r.onload=e=>{document.getElementById('img').src=e.target.result;document.getElementById('box').style.display='block';};r.readAsDataURL(i.files[0]);}}
function pub(){
 let t=title.value.trim(), l=linkedin.value.trim(), d=desc.value.trim(), f=image.files[0];
 if(!t||!f)return alert('Title & Image required');
 let r=new FileReader();r.onload=e=>{
  let post={title:t,linkedin:l,desc:d,image:e.target.result,date:new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})};
  let old=JSON.parse(localStorage.getItem('jameel_posts')||'[]');old.unshift(post);localStorage.setItem('jameel_posts',JSON.stringify(old));
  out.innerHTML=`<div class="success">✅ Published!<br>Copy this and paste in posts.json on GitHub<br><textarea id="cb">${JSON.stringify(old,null,2)}</textarea><br><button onclick="navigator.clipboard.writeText(document.getElementById('cb').value);alert('Copied!')" style="margin-top:10px;padding:8px 14px;border-radius:20px;border:none;font-weight:700">Copy Code</button></div>`;
  window.scrollTo({top:9999,behavior:'smooth'});
 };r.readAsDataURL(f);
}
</script>
</body>
</html>
