<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jameel Hussain | Visual Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#FFF8F0;color:#111}
header{background:linear-gradient(135deg,#111 0%,#222 50%,#FF6B2B 300%);color:#fff;padding:90px 20px 70px;text-align:center;position:relative;overflow:hidden}
header::before{content:'';position:absolute;width:400px;height:400px;background:#FF6B2B;filter:blur(100px);opacity:.3;top:-100px;right:-100px;border-radius:50%}
header h1{font-size:52px;font-weight:800;position:relative}
header h1 span{color:#FF6B2B}
.tag{margin-top:14px;display:inline-block;background:#fff;color:#111;padding:8px 18px;border-radius:30px;font-size:12px;font-weight:700;position:relative}
.sub{opacity:.6;margin-top:14px;font-size:14px;position:relative}
.container{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;margin-top:30px}
.post{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.06);border:1px solid #FFE9D9;transition:.4s}
.post:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(0,0,0,.1)}
.img-wrap{width:100%;height:340px;background:#FFF8F0;display:flex;align-items:center;justify-content:center;padding:12px}
.img-wrap img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:16px}
.post-body{padding:18px}
.meta{font-size:10px;color:#FF6B2B;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.post-body h3{font-size:17px;margin:6px 0}
.post-body p{font-size:13px;color:#666;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btns{margin-top:14px;display:flex;gap:8px}
.btn{padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;text-decoration:none}
.btn-li{background:#111;color:#fff} .btn-share{background:#FFE9D9;color:#111}
.empty{grid-column:1/-1;text-align:center;background:#fff;padding:60px;border-radius:22px;border:1px dashed #FFD2B8}
.admin{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:20px;font-size:11px;text-decoration:none;backdrop-filter:blur(10px)}
</style>
</head>
<body>
<header>
<a href="admin.html" class="admin">Admin</a>
<h1>Jameel <span>Hussain</span></h1>
<div class="tag">✨ Graphics Designer • Logo & Social Media Expert</div>
<p class="sub">Daily design work — crafted with passion</p>
</header>
<div class="container">
<h2 style="font-size:20px;font-weight:800">Latest Works ✨</h2>
<div id="posts" class="grid"><div class="empty">Loading...</div></div>
</div>
<script>
async function load(){
 let r=await fetch('posts.json?v='+Date.now());
 let posts=await r.json();
 let box=document.getElementById('posts');
 if(!posts.length){box.innerHTML=`<div class="empty">No designs yet<br><br><a href="admin.html" style="background:#111;color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none">Publish First Design</a></div>`;return;}
 box.innerHTML=posts.map(p=>`<div class="post"><div class="img-wrap"><img src="${p.image}" loading="lazy"></div><div class="post-body"><div class="meta">${p.date||''}</div><h3>${p.title}</h3><p>${p.desc||''}</p><div class="btns">${p.linkedin?`<a class="btn btn-li" href="${p.linkedin}" target="_blank">LinkedIn</a>`:''}<a class="btn btn-share" href="#">Share</a></div></div></div>`).join('');
}
load();
</script>
</body>
</html>
