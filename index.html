<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jameel Hussain | Visual Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0A2F2F;color:#fff;min-height:100vh}
header{text-align:center;padding:70px 20px 50px;border-bottom:1px solid rgba(255,255,255,.08);position:relative}
h1{font-size:46px;font-weight:800} h1 span{color:#FF6B1A}
.tag{margin-top:10px;display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:7px 16px;border-radius:30px;font-size:11px;color:rgba(255,255,255,.7)}
.container{max-width:1150px;margin:auto;padding:30px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px;margin-top:24px}
.card{background:#0F3A3A;border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:#FF6B1A55}
.imgbox{width:100%;height:340px;background:#0C3535;display:flex;align-items:center;justify-content:center;padding:10px}
.imgbox img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:10px}
.info{padding:16px}
.meta{font-size:10px;color:#FF6B1A;font-weight:700;letter-spacing:1px}
.info h3{font-size:15px;margin:5px 0;color:#fff}
.info p{font-size:12px;opacity:.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btns{margin-top:12px;display:flex;gap:8px}
.btns a{padding:7px 12px;border-radius:6px;font-size:11px;font-weight:700;text-decoration:none}
.li{background:#FF6B1A;color:#fff}.sh{background:rgba(255,255,255,.1);color:#fff}
.empty{grid-column:1/-1;text-align:center;padding:70px;background:#0F3A3A;border:1px dashed rgba(255,255,255,.2);border-radius:16px;color:rgba(255,255,255,.5)}
.admin{position:absolute;top:18px;right:18px;background:#FF6B1A;color:#fff;padding:7px 13px;border-radius:6px;font-size:11px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<header>
<a href="admin.html" class="admin">ADMIN LOGIN</a>
<h1>Jameel <span>Graphics</span></h1>
<div class="tag">Graphics Designer • Logo & Social Media Expert</div>
</header>
<div class="container">
<p style="font-size:11px;letter-spacing:2px;opacity:.4">LATEST WORKS ✨</p>
<div id="posts" class="grid"><div class="empty">Loading designs...</div></div>
</div>
<script>
async function load(){
 try{
  let res = await fetch('posts.json?v='+Date.now());
  let posts = await res.json();
  let box = document.getElementById('posts');
  if(!posts.length){
    box.innerHTML = `<div class="empty">No designs yet<br><br><a href="admin.html" style="background:#FF6B1A;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:700">Publish First Post</a></div>`;
    return;
  }
  box.innerHTML = posts.map(p=>`
    <div class="card">
      <div class="imgbox"><img src="${p.image}" loading="lazy"></div>
      <div class="info">
        <div class="meta">${p.date||''}</div>
        <h3>${p.title}</h3>
        <p>${p.desc||''}</p>
        <div class="btns">
          ${p.linkedin?`<a class="li" href="${p.linkedin}" target="_blank">LinkedIn</a>`:''}
          <a class="sh" href="#">Share</a>
        </div>
      </div>
    </div>
  `).join('');
 }catch(e){
  document.getElementById('posts').innerHTML = '<div class="empty">posts.json not found - Create posts.json file with []</div>';
 }
}
load();
</script>
</body>
</html>
